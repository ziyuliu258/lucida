model:
  name_or_path: Qwen/Qwen3-VL-2B-Instruct
  dtype: bfloat16
  freeze_vision_encoder: true
  gradient_checkpointing: true
  vision_max_pixels: 262144
  vision_min_pixels: 65536

lora:
  rank: 16
  alpha: 32
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj, qkv, proj, linear_fc1, linear_fc2]

# Continue from focus-final and spend more optimizer updates on the two
# complete action strings that are still missed by teacher-forced decoding.
# The multiplier is deliberately moderate; the fixed dataset remains unchanged.
action_weighting:
  enabled: true
  example_weight_mode: empirical_plus_uniform_action_band
  empirical_mass: 0.50
  uniform_action_band_mass: 0.50
  action_band_min_frequency: 4
  action_band_max_frequency: 19
  focus_action_multiplier: 4.0
  syntax_token_weight: 1.0
  opening_tag_weight: 2.0
  payload_value_weight: 4.0
  normalize_token_weights_per_turn: true
  normalize_example_weights: true

training:
  seed: 20260922
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 0.000003
  weight_decay: 0.0
  max_steps: 1000
  warmup_ratio: 0.02
  logging_steps: 10
  save_steps: 200
  eval_steps: 200
  max_sequence_length: 8192
  bf16: true
  overfit_loss_threshold: -1.0
  overfit_loss_patience: 0

distributed:
  backend: nccl
  launcher: torchrun
  deepspeed_config: configs/zero3.json
