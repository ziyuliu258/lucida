model:
  name_or_path: Qwen/Qwen3-VL-2B-Instruct
  dtype: bfloat16
  freeze_vision_encoder: true
  gradient_checkpointing: true
  # The fixed observations contain a small colored gizmo.  The baseline's
  # 262,144-pixel ceiling loses too much of that state information on the
  # longer image histories.  This remains within the 8,192-token guard while
  # making the visual input about 1.5x denser in each spatial dimension.
  vision_max_pixels: 393216
  vision_min_pixels: 65536

lora:
  rank: 16
  alpha: 32
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj, qkv, proj, linear_fc1, linear_fc2]

# Same frozen 50 trajectories and the same semantic/action-frequency loss as
# phase two.  This deliberately avoids the failed hard-example multiplier,
# which made common early actions regress.
action_weighting:
  enabled: true
  syntax_token_weight: 1.0
  opening_tag_weight: 2.0
  payload_value_weight: 4.0
  action_frequency_exponent: 0.75
  action_frequency_cap: 4.0
  normalize_token_weights_per_turn: true
  normalize_example_weights: true

training:
  seed: 20260922
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 0.00001
  weight_decay: 0.0
  max_steps: 1000
  warmup_ratio: 0.02
  logging_steps: 1
  save_steps: 250
  eval_steps: 250
  max_sequence_length: 8192
  bf16: true
  overfit_loss_threshold: -1.0
  overfit_loss_patience: 0

distributed:
  backend: nccl
  launcher: torchrun
  deepspeed_config: configs/zero3.json
