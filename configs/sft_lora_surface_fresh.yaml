model:
  name_or_path: models/Qwen3-VL-2B-Instruct
  dtype: bfloat16
  freeze_vision_encoder: true
  gradient_checkpointing: true
  vision_max_pixels: 393216
  vision_min_pixels: 65536

lora:
  rank: 16
  alpha: 32
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj, qkv, proj, linear_fc1, linear_fc2]

# Fresh-base SFT on the unchanged 207 supervised turns. Semantic action tokens
# and rare complete actions receive the established static weighting; no
# previous-model error list, focus multiplier, or hard-mining is used.
action_weighting:
  enabled: true
  syntax_token_weight: 1.0
  opening_tag_weight: 2.0
  payload_value_weight: 4.0
  action_frequency_exponent: 0.75
  action_frequency_cap: 4.0
  normalize_token_weights_per_turn: true
  normalize_example_weights: true

training:
  seed: 20260922
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 0.00001
  weight_decay: 0.0
  max_steps: 1000
  warmup_ratio: 0.02
  logging_steps: 1
  save_steps: 200
  eval_steps: 200
  max_sequence_length: 8192
  bf16: true
  overfit_loss_threshold: -1.0
  overfit_loss_patience: 0

distributed:
  backend: nccl
  launcher: torchrun
  deepspeed_config: configs/zero3.json
