[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lucida-mini"
version = "0.1.0"
description = "A fixed-50-trajectory GizmoAct overfitting reproduction"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "pydantic>=2.7,<3",
  "pyyaml>=6,<7",
  "trimesh>=4.4,<5",
  "pillow>=10,<13",
  "matplotlib>=3.8,<4",
  "opencv-python-headless>=4.10,<5",
  "pyrender>=0.1.45,<0.2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
data = ["gdown>=6.4,<7", "remotezip>=0.12,<1"]
train = [
  "accelerate>=1.7,<2",
  "datasets>=3,<5",
  "peft>=0.17,<1",
  "transformers>=4.57,<5",
  "qwen-vl-utils>=0.0.14,<1",
  "tensorboard>=2.17,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
